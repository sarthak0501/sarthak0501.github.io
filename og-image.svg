<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#3ee0e8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.16" cy="0.0" r="0.8">
      <stop offset="0" stop-color="rgba(124,131,255,0.22)"/>
      <stop offset="1" stop-color="rgba(124,131,255,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1.0" r="0.6">
      <stop offset="0" stop-color="rgba(62,224,232,0.12)"/>
      <stop offset="1" stop-color="rgba(62,224,232,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#06070f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- latent-space embedding cloud (echoes the live hero) -->
  <g stroke="#7c83ff" stroke-width="1" opacity="0.4">
    <line x1="966" y1="452" x2="1054" y2="500"/>
    <line x1="1054" y1="500" x2="1118" y2="432"/>
    <line x1="966" y1="452" x2="1016" y2="560"/>
    <line x1="1054" y1="500" x2="1150" y2="548"/>
    <line x1="1016" y1="560" x2="1118" y2="432"/>
    <line x1="1054" y1="500" x2="1096" y2="396"/>
  </g>
  <circle cx="966"  cy="452" r="4"   fill="#c084fc"/>
  <circle cx="1054" cy="500" r="5"   fill="#7c83ff"/>
  <circle cx="1118" cy="432" r="4"   fill="#3ee0e8"/>
  <circle cx="1016" cy="560" r="4"   fill="#7c83ff"/>
  <circle cx="1150" cy="548" r="3.5" fill="#3ee0e8"/>
  <circle cx="1096" cy="396" r="3.5" fill="#c084fc"/>

  <!-- accent bar -->
  <rect x="80" y="118" width="4" height="74" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="104" y="142" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="16" font-weight="700" fill="#7c83ff" letter-spacing="3.5">
    SR. DATA &amp; APPLIED SCIENTIST · MICROSOFT · AI CHAMPION
  </text>

  <!-- location -->
  <text x="104" y="178" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="14" fill="#a7aacb" letter-spacing="2">
    REDMOND, WA · AZURE STORAGE
  </text>

  <!-- name -->
  <text x="79" y="292" font-family="'Space Grotesk',Inter,system-ui,sans-serif"
        font-size="86" font-weight="700" fill="#edeefb" letter-spacing="-3">
    Sarthak Bichhawa
  </text>

  <!-- headline -->
  <text x="80" y="382" font-family="'Space Grotesk',Inter,system-ui,sans-serif"
        font-size="46" font-weight="600" fill="#edeefb" letter-spacing="-1.5">
    Production AI,
  </text>
  <text x="80" y="436" font-family="'Space Grotesk',Inter,system-ui,sans-serif"
        font-size="46" font-weight="600" fill="url(#accent)" letter-spacing="-1.5">
    built to ship.
  </text>

  <!-- impact chips -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="214" height="40" rx="6" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="16" y="26" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#edeefb" letter-spacing="1">$45M/MO RECOVERED</text>

    <rect x="230" y="0" width="196" height="40" rx="6" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="246" y="26" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#edeefb" letter-spacing="1">HRS → MIN TRIAGE</text>

    <rect x="442" y="0" width="270" height="40" rx="6" fill="none" stroke="rgba(124,131,255,0.55)" stroke-width="1"/>
    <text x="458" y="26" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#7c83ff" letter-spacing="1">MULTI-AGENT LLM SHIPPED</text>
  </g>

  <!-- url -->
  <text x="80" y="588" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="14" fill="#a7aacb" letter-spacing="2">
    sarthak0501.github.io
  </text>

  <!-- monogram tile -->
  <g transform="translate(980, 118)">
    <rect width="140" height="140" rx="22" fill="#06070f" stroke="url(#accent)" stroke-width="2"/>
    <text x="70" y="102" text-anchor="middle" font-family="'Space Grotesk',Inter,system-ui,sans-serif"
          font-size="74" font-weight="700" fill="url(#accent)">SB</text>
  </g>

  <!-- focus keywords -->
  <g transform="translate(980, 292)" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
     font-size="12" fill="#a7aacb" letter-spacing="2">
    <text x="140" y="0" text-anchor="end">// MULTI-AGENT LLM</text>
    <text x="140" y="22" text-anchor="end">// FOUNDATIONAL ML</text>
    <text x="140" y="44" text-anchor="end">// EMBEDDINGS</text>
    <text x="140" y="66" text-anchor="end">// AZURE STORAGE</text>
  </g>
</svg>
