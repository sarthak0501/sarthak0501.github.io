<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e0c" />
  <meta name="robots" content="noindex" />
  <title>404 — not in the brief · Sarthak Bichhawa</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440..760;1,9..144,440..760&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e0c;
      --green: #62e9a6;
      --green-dim: #3da876;
      --orange: #ff7a45;
      --paper: #f2efe3;
      --paper-2: #b8b5a6;
      --paper-3: #7f7d6f;
      --border: rgba(238, 235, 222, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); }
    body {
      font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(rgba(238, 235, 222, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(238, 235, 222, 0.03) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .card {
      max-width: 560px; width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(244, 241, 230, 0.03);
      overflow: hidden;
    }
    .card-head {
      display: flex; justify-content: space-between; gap: 1rem;
      padding: 0.6rem 1.4rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.64rem; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--paper-3);
    }
    .card-head .miss { color: var(--orange); }
    .card-body { padding: 2.4rem 2rem 2.2rem; text-align: center; }
    .code {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-optical-sizing: auto;
      font-size: 4.6rem; font-weight: 600; line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
    }
    .code em { font-style: italic; color: var(--green); }
    h1 {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-size: 1.35rem; font-weight: 580; letter-spacing: -0.01em;
      margin-bottom: 0.8rem;
    }
    p { font-size: 0.8rem; line-height: 1.75; color: var(--paper-2); max-width: 400px; margin: 0 auto 1.8rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.8rem 1.25rem;
      font-size: 0.82rem; font-weight: 600; line-height: 1;
      color: #07120c; background: var(--green);
      border-radius: 6px; text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn:hover { background: #79f0b5; transform: translateY(-2px); }
    .foot { padding: 0.7rem 1.4rem; border-top: 1px solid var(--border); font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--paper-3); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <span>Hiring brief — Sarthak Bichhawa</span>
      <span class="miss">Exhibit missing</span>
    </div>
    <div class="card-body">
      <div class="code">§<em>404</em></div>
      <h1>This page isn't in the brief.</h1>
      <p>The document you're after was moved, renamed, or never filed. The evidence you actually want is one click away.</p>
      <a class="btn" href="/">← Back to the brief</a>
    </div>
    <div class="foot">Doc SB-26 · sarthak0501.github.io</div>
  </main>
</body>
</html>
