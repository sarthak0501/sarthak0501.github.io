name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.mjs derives rev/date from git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser for private dashboard, responsive and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Assistant grounding and security contracts
        run: npm run test:assistant
      - name: Verify Worker bundle without credentials
        run: npm run assistant:check
      - name: Verify private dashboard bundle without credentials
        run: npm run assistant:admin:check
      - name: Receipts linter — claims must match facts.yaml
        run: npm run lint:receipts
      - name: Homepage, accessibility and assistant interactions
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
