record:
  - id: record-microsoft
    company: Microsoft
    location: Redmond, WA
    role: Sr. Data & Applied Scientist
    dates: Nov 2020 – present
    leadership_band:
      - org-recognized AI Champion — drove AI adoption across the team
      - co-led a 90-minute internal AI Day-of-Learning
      - sustained code-review mentoring + onboarded a new hire
      - led 4-team cross-org Sev2 incident response
      - 8+ engineering/support teams aligned on one health program
    workstreams:
      - name: AI & agentic systems
        bullets:
          - Cut customer-health time-to-insight from days to <2 minutes with an enterprise LLM agent for Mission-Critical Customers — natural-language questions become governed live Kusto/ADX queries with PM-ready narratives, grounded on a curated catalog of 13 metric domains.
          - Reduced multi-hour on-call incident investigations to minutes with an autonomous multi-agent investigation agent — planner/executor LLM loop on Azure OpenAI with context compaction, confidence scoring, and run tracing (FastAPI on Azure).
          - Shipped two reusable Model Context Protocol (MCP) tool servers — one almost entirely AI-generated — serving governed query and telemetry tools to Copilot, VS Code, and internal agents.
      - name: Applied ML & data-quality platform
        bullets:
          - Enabled fleet-scale similarity search, segmentation, and embedding-drift anomaly detection across millions of accounts by designing an account-behavior embedding model (autoencoder + FAISS) that compresses each Azure Storage account into a vector fingerprint.
          - Caught silent upstream data regressions — including an ~88% row-collapse — before they reached dashboards or Finance, with a self-service data-quality monitoring service (Python/FastAPI, anomaly detection, 76 tests, Azure Container Apps) adopted across teams, plus hourly table-health profiling over 47 datasets.
      - name: Partner revenue & business reporting
        bullets:
          - Recovered and sustained ~$45M/month in influenced partner revenue (<1% variance vs Finance, ~4× partner coverage) by rebuilding a 20+ component attribution pipeline with multi-partner credit replacing last-writer-wins — lifting partner-attributed influenced revenue >10% month-over-month.
          - Collapsed monthly business-review reporting from a multi-day manual process to a governed ~5-minute pipeline (>95% effort reduction), now in regular leadership use.
      - name: Reliability & experimentation
        bullets:
          - Built an adaptive pre-release stress-testing program for Azure Storage informing per-build ship/hold decisions; helped prevent 10+ Sev1/Sev2 customer incidents by catching top-severity regressions before rollout.
          - Ran thousands of controlled simulations per build across 20 workload types, distilling ~500 failure signals into 15 recurring failure modes and confirming 50+ issues with reproduction steps and quantified impact.
          - Prioritized high-yield test scenarios with online learning (multi-armed bandits) and tuned scoring thresholds on outcomes, cutting false positives 60%; led a 2-person effort and authored the design doc + internal white paper.
      - name: Mission-critical customer health
        bullets:
          - Drove the MCC health program and a unified customer-health view across 8+ engineering/support teams, cutting executive/customer readiness insight from 3–5 days to near real-time — with ~50% fewer >10-day aging issues and ~16% faster time-to-mitigate.
          - Helped reverse churn risk for 10+ critical customers — each representing multi-millions in monthly Azure Storage revenue — by accelerating early detection and action on customer-impacting issues.
          - Shipped 15+ Azure Advisor recommendations adopted across hundreds of thousands of customer accounts to improve cost and performance.
