record:
  - id: record-microsoft
    company: Microsoft
    location: Redmond, WA
    role: Sr. Data & Applied Scientist
    dates: Nov 2020 – present
    scope: Own revenue-critical data platforms, customer-health analytics, and applied-AI systems for one of the world's largest cloud storage services.
    leadership_band:
      - org-recognized AI Champion — taught a hands-on internal workshop on agent-based automation
      - sustained code-review mentoring for engineers across the team
      - led 4-team cross-org severity-2 incident response
      - 8+ engineering and support teams aligned on one customer-health program
    workstreams:
      - name: AI & agentic systems
        bullets:
          - Cut executive-review prep from days to under 2 minutes with an LLM agent that answers customer-health questions in plain English by querying live telemetry — governed queries grounded on a curated catalog of 13 metric domains.
          - Reduced multi-hour on-call incident diagnosis to minutes with an autonomous multi-agent investigator — a planner/executor loop on Azure OpenAI with context compaction, confidence scoring, and run tracing (FastAPI on Azure).
          - Shipped four reusable Model Context Protocol (MCP) tool servers — including one that lets Copilot query any live operations dashboard — serving governed query and telemetry tools to internal agents.
      - name: Partner revenue & business reporting
        bullets:
          - Recovered ~$45M/month of partner-attributed revenue after an upstream data loss silently broke attribution for $5B+/year of revenue — traced the failure through a 20+ component legacy pipeline, sourced an alternate telemetry feed, and drove six months of backfills through quarter close (7 incidents, including a severity-2 I led across 4 teams).
          - Redesigned the attribution engine end-to-end — multi-partner revenue credit replacing last-writer-wins (~80–90% more partner accounts tracked), validation gates with automated backfills, and independent reconciliation against Finance actuals, holding <1% variance vs Finance so the business can trust the numbers.
          - Automated the monthly business review from a multi-day manual process into a governed ~5-minute pipeline (>95% less effort) that reconciles automatically against Finance actuals and is now consumed directly by leadership.
      - name: Data trust & platform
        bullets:
          - Built a self-service data-quality platform — automated freshness, volume, and schema anomaly checks, quality gates, and hourly profiling of 400+ production datasets — whose first named catch was an 88% silent row loss headed for financial reports.
          - Grew it into an internal data discovery and governance portal and designed its core services — including an LLM-powered lineage engine that reads pipeline code to map production data flows — launched org-wide so any engineer can answer "can I rely on this data right now?"
          - Enabled fleet-scale similarity search, segmentation, and drift-based anomaly detection by designing an account-behavior embedding model (autoencoder + FAISS) that compresses millions of storage accounts into vector fingerprints; productionizing with a first consumer.
      - name: Reliability & experimentation
        bullets:
          - Eliminated 99% of performance-throttling incidents for the platform's most critical customers (92% across all paying customers) by building fleet-wide telemetry pipelines and an early-warning dashboard with automated triage.
          - Designed a simulation-based stress-testing program running thousands of controlled experiments per release, with multi-armed bandits prioritizing scenarios — preventing 10+ major customer incidents and cutting test-infrastructure cost 40%.
          - Ran thousands of controlled simulations per build across 20 workload types, distilling ~500 failure signals into 15 recurring failure modes and confirming 50+ issues with reproduction steps and quantified impact; tuned scoring thresholds on outcomes, cutting false positives 60%.
      - name: Customer health & governance
        bullets:
          - Drove the executive health-review program for the largest storage customers across 8+ engineering teams — 50% fewer long-aging issues, 16% faster mitigation, helping retain 10+ accounts worth millions per month each.
          - Led security and compliance modernization for the team's data estate — a service-authentication overhaul, GDPR-driven data cleanup with the security org, and 15+ pipeline migrations off a deprecated platform.
          - Shipped 15+ Azure Advisor recommendations adopted across hundreds of thousands of customer accounts to improve cost and performance.
      - name: Foundations (2020–22)
        bullets:
          - Built the team's analytics foundation — migrated scheduled jobs off a deprecated orchestrator, deployed cross-cluster monitoring for missing and late data, and scaled a near-real-time configuration pipeline across regions.
  - id: record-walmart
    company: Walmart Labs
    location: Bentonville, AR
    role: Senior Data Scientist
    dates: Feb 2019 – Nov 2020
    bullets:
      - Delivered ~7% category revenue lift across 50 stores with an end-to-end shelf-layout optimization system, cutting planning cycles from weeks to hours.
      - Built product association and substitution analytics (behavior tree + demand-transfer "universes") to support assortment and replenishment decisions.
      - Led 4 data scientists + 2 interns to productionize a repeatable item-level placement workflow; earned a Spot Award.
  - id: record-ias
    company: Integral Ad Science
    location: New York, NY
    role: Data Scientist Intern
    dates: Jun – Aug 2018
    bullets:
      - Built a PySpark contextual text-classification pipeline processing ~1M URLs/day across 846 categories at 88% accuracy; improved label quality via correlation analysis.
  - id: record-musigma
    company: Mu Sigma
    location: Bengaluru, India
    role: Data Scientist
    dates: Oct 2015 – Jul 2017
    bullets:
      - Modeled customer lifetime value with probabilistic and regression models for Fortune-500 clients; improved competitive reporting by unifying product IDs via fuzzy matching.

